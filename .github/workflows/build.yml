
name: Build Delta Force Companion APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q DeltaForceCompanion.zip -d source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Release APK
        working-directory: source/DeltaForceCompanion
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp source/DeltaForceCompanion/app/build/outputs/apk/release/app-release.apk dist/DeltaForceCompanion-v2.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceCompanion-APK
          path: dist/*.apk
          retention-days: 30
          
